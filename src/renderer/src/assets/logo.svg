<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.55" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App tile: 824px on a 1024 canvas, the macOS icon grid -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#shine)"/>

  <g filter="url(#shadow)">
    <!-- Antennas -->
    <path d="M440 318 L372 226 M584 318 L652 226" stroke="#ffffff" stroke-width="34" stroke-linecap="round"/>
    <circle cx="372" cy="226" r="26" fill="#ffffff"/>
    <circle cx="652" cy="226" r="26" fill="#ffffff"/>

    <!-- Screen -->
    <rect x="226" y="318" width="572" height="396" rx="70" fill="url(#screen)" stroke="#ffffff" stroke-width="36"/>

    <!-- Play button -->
    <path d="M444 424 Q444 400 465 412 L604 494 Q624 506 604 518 L465 600 Q444 612 444 588 Z" fill="#ffffff"/>

    <!-- Stand -->
    <rect x="432" y="744" width="160" height="34" rx="17" fill="#ffffff" fill-opacity="0.9"/>
  </g>
</svg>
