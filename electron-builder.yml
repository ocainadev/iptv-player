appId: local.personal.iptvplayer
productName: Telara
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
dmg:
  # No spaces, for the same GitHub reason as the NSIS installer below (latest-mac.yml uses this name).
  artifactName: Telara-${version}-${arch}.${ext}
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.video
  # Ad-hoc signature for personal use: no Apple Developer account needed.
  # Apple Silicon refuses fully unsigned apps; ad-hoc only needs a first-open confirm.
  identity: '-'
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
linux:
  target:
    # The arm64 AppImage runtime is linked against libz.so (the zlib dev symlink), which most
    # desktops do not have, so ARM Linux (Raspberry Pi) gets the .deb only.
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64, arm64]
  category: AudioVideo
  icon: build/icon.png
  synopsis: Personal IPTV player
  description: Personal IPTV player for Xtream Codes and M3U playlists
appImage:
  # No spaces, for the same GitHub reason as the NSIS installer below.
  artifactName: Telara-${version}-${arch}.${ext}
deb:
  artifactName: Telara-${version}-${arch}.${ext}
  # electron-builder's defaults lack the ALSA library, which Electron needs at startup; Ubuntu 24.04
  # renamed it to libasound2t64.
  depends: [libgtk-3-0, libnotify4, libnss3, libxss1, libxtst6, xdg-utils, libatspi2.0-0, libuuid1, libsecret-1-0, 'libasound2t64 | libasound2']
portable:
  artifactName: Telara-Portable-${version}.${ext}
nsis:
  # No spaces: GitHub renames spaces to dots on upload, which would break the name in latest.yml.
  artifactName: Telara-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
# Where the installed app (electron-updater) looks for new versions. Keep in sync with src/main/updater.js.
publish:
  provider: github
  owner: ocainadev
  repo: telara
